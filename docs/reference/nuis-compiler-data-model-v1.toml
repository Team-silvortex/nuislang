protocol = "nuis-compiler-data-model-v1"
version = 1
status = "usable-bounded"
scope = "bootstrap-compiler-owned-data"
public_std_stability = false
source_module = "stdlib/std/lib/language_core.ns"
std_surface = "surface.std.compiler-data-model.v1"
bootstrap_subset = "nuis-bootstrap-language-subset-v2"
host_layout_identity = false
host_ffi_required = false
capacity_model = "fixed-four-slot-proof"
utf8_policy = "canonical-unicode-scalar-encoding"
example_project = "examples/projects/tooling/bootstrap_compiler_data_model_demo"
expected_native_exit = 43
bootstrap_validation = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc --test bootstrap_cli command_bootstrap_cli_accepts_the_compiler_data_model_project -j 1"
native_validation = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"

types = [
  "Option<T>",
  "CompilerVector<T>",
  "CompilerText",
  "CompilerMap",
  "CompilerArena",
  "CompilerSourceSpan",
  "CompilerPath",
  "CompilerDiagnostic",
]

operations = [
  "compiler_vector_empty<T>",
  "compiler_vector_push<T>",
  "compiler_vector_get<T>",
  "compiler_vector_set<T>",
  "compiler_text_empty",
  "compiler_text_push_scalar",
  "compiler_text_byte_length",
  "compiler_map_empty",
  "compiler_map_insert",
  "compiler_map_get",
  "compiler_arena_new",
  "compiler_arena_allocate",
  "compiler_source_span",
  "compiler_source_span_width",
  "compiler_path_empty",
  "compiler_path_push",
  "compiler_diagnostic",
  "compiler_diagnostic_score",
]

invariants = [
  "vector-length-is-between-zero-and-four",
  "invalid-vector-index-never-exposes-a-slot",
  "text-bytes-are-canonical-utf8-for-accepted-unicode-scalars",
  "text-rejects-surrogates-and-out-of-range-scalars",
  "map-upsert-preserves-unique-key-identity",
  "arena-indices-are-monotonic-and-capacity-bounded",
  "source-spans-are-nonnegative-half-open-ranges",
  "path-segments-are-nonnegative-interned-identities",
  "diagnostic-code-is-positive-and-severity-is-zero-through-two",
]

[[errors]]
code = 1
name = "capacity-exhausted"

[[errors]]
code = 2
name = "invalid-index"

[[errors]]
code = 3
name = "invalid-input"

[growth_boundary]
status = "open"
next_contract = "deterministic-page-or-chunk-backed-containers"
preserve = [
  "owned-value-semantics",
  "canonical-utf8",
  "stable-arena-indices",
  "fail-closed-errors",
  "host-layout-independence",
]
