[next_slice]
action = "bind the registered worker's RGBA8 result and physical completion into NovaFrameResultHandle so the live NS Nova lifecycle, rather than an embedded YIR framebuffer path, owns presentation"
validation = "run the compiled NS Nova project through automatic render contribution and request projection, consume the worker-returned 160x120 RGBA8 frame and physical fence in the application lifecycle, reject asset or receipt drift, and retain a symmetric non-Metal provider boundary"
