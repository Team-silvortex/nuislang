protocol = "nuis-bootstrap-language-subset-v1"
version = 1
status = "frozen"
scope = "compiler-authoring-source"
public_language_compatibility = false
module_domains = ["cpu"]
primitive_types = ["bool", "i64", "text"]
approved_imports = [
  "cpu/CorePrelude",
  "cpu/StdLanguageCore",
  "cpu/StdTextContracts",
  "project-local-cpu-unit",
]
approved_external_types = [
  "Option",
  "Result",
  "CompilerText",
  "CompilerVector",
  "CompilerMap",
  "CompilerArena",
  "CompilerSourceSpan",
  "CompilerDiagnostic",
  "CompilerPath",
]
allowed_items = ["const", "type-alias", "struct", "enum", "function"]
allowed_generics = ["unbounded-type-parameters"]
allowed_control_flow = ["if", "match", "while", "break", "continue", "return", "try"]
allowed_expressions = [
  "bool-literal",
  "text-literal",
  "i64-literal",
  "local-variable",
  "direct-call",
  "method-call",
  "struct-literal",
  "field-access",
  "not",
  "negate",
  "binary-operator",
]
rejected_capabilities = [
  "non-cpu-domain",
  "unapproved-import",
  "extern-or-ffi",
  "non-doc-attribute",
  "trait-or-impl",
  "bounded-generic",
  "unapproved-type",
  "reference-or-optional-address-type",
  "async-function",
  "test-or-benchmark-harness",
  "host-effect",
  "floating-point",
  "lambda-or-dynamic-invoke",
  "await",
  "heterogeneous-instantiation",
  "raw-dereference",
  "reserved-runtime-intrinsic",
]
accepted_fixture = "tests/fixtures/bootstrap/accepted/compiler_scanner.ns"
rejected_fixture_root = "tests/fixtures/bootstrap/rejected"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
frontdoor = "nuisc bootstrap-check [--json] <input.ns|project-dir|nuis.toml>"

[[diagnostics]]
code = "NBS001"
capability = "non-cpu-domain"

[[diagnostics]]
code = "NBS002"
capability = "unapproved-import"

[[diagnostics]]
code = "NBS003"
capability = "extern-or-ffi"

[[diagnostics]]
code = "NBS004"
capability = "non-doc-attribute"

[[diagnostics]]
code = "NBS005"
capability = "trait-or-impl"

[[diagnostics]]
code = "NBS006"
capability = "bounded-generic"

[[diagnostics]]
