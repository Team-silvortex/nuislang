protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.7.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v1 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v1, nuisc bootstrap-check, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v1; compiler-owned text, vector, map, arena, span, diagnostic, and path behavior remains the next independent readiness gate"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 80
required_before = "beta-0.10.0"
next_action = "page CompilerMap and arena storage, generalize nested-page specialization, and reduce pure aggregate expansion cost while preserving the v2 ownership and layout invariants"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v2 plus a pure Nuis compiler component whose text and tokens cross deterministic page boundaries, pass bootstrap-check, build without deferred LLVM lowering, and exit with deterministic score 59"
blocker = "v2 raises vectors to sixteen ordered i64 values, but maps remain four-entry, arenas lack object storage, generic page specialization lacks defining-module provenance, and large pure value expansion remains expensive"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "usable"
progress = 78
required_before = "beta-0.10.0"
next_action = "move one real token or structural-body transformation behind the verified scalar producer boundary without giving the adapter compiler semantics"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1"
expected_artifact = "a Nuis-produced non-identity stage transformation whose complete five-stage semantic identity still crosses the attested differential gate"
blocker = "the Nuis producer now consumes every serialized stage byte and owns the bundle fold, but shared host code still owns token and structural-body decoding"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "usable"
progress = 80
required_before = "beta-0.10.0"
next_action = "generalize the first projection-relay producer boundary to one non-identity leaf and prove its candidate identity across independent clean builds"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1"
expected_artifact = "two independent clean builds of a Nuis-produced stage1-candidate leaf with stable reproducible identity and no replacement authority"
blocker = "the first Nuis stage1-candidate component, diagnostics, production proof, and differential now exist; clean-build reproducibility and a general producer ABI remain open"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "usable"
progress = 78
required_before = "beta-0.10.0"
next_action = "repeat the repository-native 13/13 candidate differential across independent clean builds and aggregate stable reproducible identities"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_diff -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1"
expected_artifact = "a repeated-clean-build differential aggregate that remains equivalent while an independent reversible authorization is still absent"
blocker = "one repository-native Nuis stage1 leaf reaches attested 13/13 equivalence, but repeated clean-build evidence and reversible replacement authorization remain open"
