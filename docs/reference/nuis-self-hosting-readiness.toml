protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.8.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v8 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability or scalar export"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v8, nuisc bootstrap-check, twenty-one exact scalar exports, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v8; chunked individual aggregate projection and aggregate backedge lowering remain independent readiness gates"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 98
required_before = "beta-0.10.0"
next_action = "design chunked individual typed-payload projection while preserving v9 registration, stable indices, canonical identity, and atomic stores"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v9 with registered CompilerText and CompilerSourceSpan projections sharing a 20-byte cross-page arena, stable indices, canonical identities, and native exit 130"
blocker = "v9 registers text and source-span codecs over eight canonical pages, but one payload and collection indices remain bounded to sixteen, defining-module provenance and nested full-arena forwarding are incomplete, and general aggregate loop backedges remain open"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "usable"
progress = 98
required_before = "beta-0.10.0"
next_action = "preserve producer-neutral v2 selection while registering additional reversible derived encodings without stage-specific driver branches"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_stage_handoff_v2 -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1 -- --test-threads=1"
expected_artifact = "registered derived stages selected in source order with exact source, transform, payload, checkpoint, recovery, and semantic identities beside the canonical v1 bundle"
blocker = "v2 selection is closed for registered reversible transforms and one remote attestation generation binds its production lineage, but current production exercises one NIR encoding and the new authorization record is not yet consumed by a stage selector"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "usable"
required_before = "beta-0.10.0"
progress = 99
next_action = "consume one verified genesis authorization through a reversible active-component selector without mutating its attestation or losing the stage0 rollback target"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_replacement -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_remote_attestation_evidence -j 1 -- --test-threads=1"
expected_artifact = "candidate production v11 and two clean roots beneath a checked-in attestation plus a separately pinned component-owner authorization that binds stage0 to candidate and retains stage0 as rollback"
blocker = "genesis authorization is cryptographically separate from attester trust and verifies end to end, but no active-component state record consumes it and no signed generation-two rollback transition exists"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "usable"
progress = 99
required_before = "beta-0.10.0"
next_action = "define a versioned reproducibility successor that binds the exact representation report hash for each clean root while leaving signed v1 aggregates verifiable"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_representation_diff -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate pure_nuis_candidate_produces_an_attested_equivalent_stage1_component -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_remote_attestation_evidence -j 1 -- --test-threads=1"
expected_artifact = "two clean roots whose next-version aggregate binds both canonical 13/13 reports and exact selected-representation sidecar hashes without invalidating the checked-in generation-one signature"
blocker = "the live differential frontdoor consumes selected reversible v2 bytes, but generation-one reproducibility only binds that lineage transitively through production v11 and carries no sidecar report hash; no remote sidecar generation is checked in, and physical independence remains operational rather than cryptographically measurable"
