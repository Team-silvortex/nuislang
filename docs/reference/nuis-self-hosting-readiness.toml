protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.8.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v7 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability or scalar export"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v7, nuisc bootstrap-check, sixteen exact scalar exports, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v7; broader compiler-owned paging, arena storage, and aggregate backedge lowering remain independent readiness gates"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 93
required_before = "beta-0.10.0"
next_action = "paginate tokens, then page CompilerMap and arena storage while preserving v3 ownership and layout invariants"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v3 plus a production candidate that owns canonical token data and two independently verified AST/NIR pages"
blocker = "v3 resumes structural pages, but token pagination, map growth, arena object storage, defining-module provenance, and general aggregate loop backedges remain open"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "usable"
progress = 93
required_before = "beta-0.10.0"
next_action = "materialize a changed stage payload from the NIR checkpoint and define semantic equivalence for non-byte-identical stage encodings"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_structural_projection_page -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1 -- --test-threads=1"
expected_artifact = "a transformation-aware handoff whose changed stage bytes remain semantically comparable beside canonical token and two-page AST/NIR identities"
blocker = "Nuis now emits and production binds a non-identity 22-word NIR checkpoint, but the five-stage handoff still carries unchanged NIR/YIR bytes and the differential remains byte-identity based"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "usable"
progress = 94
required_before = "beta-0.10.0"
next_action = "promote the bound NIR checkpoint into a changed stage payload without coupling the driver to one transform contract"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_reproducibility -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate two_uncached_clean_candidates_bind_one_reproducibility_aggregate -j 1 -- --test-threads=1"
expected_artifact = "a registry-driven changed stage payload retaining stable production identity across two clean builds without replacement authority"
blocker = "the driver binds the generic transformation manifest and exact NIR checkpoint, while changed stage bytes, independent attester trust, and reversible authorization remain open"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "usable"
progress = 94
required_before = "beta-0.10.0"
next_action = "define a transformation-aware semantic differential before adding independent attester evidence"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_reproducibility -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuisc --lib repeated_same_thread_lowering_resets_try_expansion_names -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate two_uncached_clean_candidates_bind_one_reproducibility_aggregate -j 1 -- --test-threads=1"
expected_artifact = "non-byte-identical stage encodings retaining the path-free two-clean-build aggregate without replacement authority"
blocker = "local repeated clean-build evidence now transitively binds the NIR transformation manifest, but the 13 comparisons still require byte-identical stage payloads; independent attester trust and reversible authorization remain open"
