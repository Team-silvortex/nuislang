protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.8.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v8 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability or scalar export"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v8, nuisc bootstrap-check, twenty-one exact scalar exports, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v8; paged typed payload growth and aggregate backedge lowering remain independent readiness gates"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 96
required_before = "beta-0.10.0"
next_action = "page typed payload bytes beyond one CompilerVector while preserving v7 stable indices, canonical UTF-8, and atomic stores"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v7 with typed CompilerText projection, stable arena indices, canonical payload identity, and independently bound token and structural pages"
blocker = "v7 closes one canonical CompilerText payload column and checked owned projection, but payload bytes and collections remain bounded to sixteen, additional payload kinds and defining-module provenance are incomplete, and general aggregate loop backedges remain open"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "usable"
progress = 98
required_before = "beta-0.10.0"
next_action = "preserve producer-neutral v2 selection while registering additional reversible derived encodings without stage-specific driver branches"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_stage_handoff_v2 -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1 -- --test-threads=1"
expected_artifact = "registered derived stages selected in source order with exact source, transform, payload, checkpoint, recovery, and semantic identities beside the canonical v1 bundle"
blocker = "v2 selection is closed for registered reversible transforms and attestation v1 can bind its production lineage, but current production exercises one NIR encoding, real remote evidence is absent, and replacement authorization remains open"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "usable"
progress = 98
required_before = "beta-0.10.0"
next_action = "run component attestation v1 on one separately provisioned machine and retain its out-of-band registry hash pin"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_attestation -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1 -- --test-threads=1"
expected_artifact = "candidate production v11 and two clean roots beneath a challenge-bound signed claim verified by an externally pinned environment registry"
blocker = "the Ed25519 attester boundary is usable, but repository coverage uses a same-machine test key and reversible authorization remains open"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "usable"
progress = 97
required_before = "beta-0.10.0"
next_action = "run the signed two-clean-build gate on an independently provisioned environment and verify it against an out-of-band registry pin"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_attestation -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis parses_bootstrap_attestation_commands -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate two_uncached_clean_candidates_bind_one_reproducibility_aggregate -j 1 -- --test-threads=1"
expected_artifact = "v2 semantic proof and exact reproducibility aggregate under a fresh challenge, strict signature, environment-scoped key, pinned registry, and false replacement authority"
blocker = "the attester channel is usable but current tests are same-machine, the 13 component comparisons still inspect canonical v1 payloads, and reversible authorization remains open"
