protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.7.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v3 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability or scalar export"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v3, nuisc bootstrap-check, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v3; broader compiler-owned paging, arena storage, production handoff integration, and aggregate cost remain independent readiness gates"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 88
required_before = "beta-0.10.0"
next_action = "bind the production candidate token handoff to CompilerTokenMaterializer, then page CompilerMap and arena storage while preserving v3 ownership and layout invariants"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v3 plus a pure Nuis component that owns, decodes, and canonically re-emits a complete token page, builds without deferred LLVM lowering, and exits with deterministic score 122"
blocker = "v3 materializes and round-trips one four-record page, but the production adapter is not connected, maps remain four-entry, arenas lack object storage, generic page specialization lacks defining-module provenance, and aggregate loops remain expensive"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "usable"
progress = 86
required_before = "beta-0.10.0"
next_action = "bind the actual stage1 candidate token bytes and materialized page identity to production evidence, then move one AST or NIR body decoder behind the same producer-neutral boundary"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_token_decoder -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_candidate_production -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate -j 1 -- --test-threads=1"
expected_artifact = "an actual candidate-produced Nuis-owned token page and canonical re-emission whose five-stage bundle still crosses the attested differential gate"
blocker = "Nuis round-trips one complete real-prefix token page, but production still exports only scalar count/fold evidence; AST/NIR bodies and changed stage bytes remain open"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "usable"
progress = 87
required_before = "beta-0.10.0"
next_action = "bind the production candidate's materialized token page and canonical hash while retaining the clean-build aggregate"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_reproducibility -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate two_uncached_clean_candidates_bind_one_reproducibility_aggregate -j 1 -- --test-threads=1"
expected_artifact = "a Nuis-decoded and canonically re-emitted token stage retaining stable identity across two clean builds without replacement authority"
blocker = "the standalone Nuis component materializes tokens, but the production candidate does not yet carry that page; independent attester trust and reversible authorization remain open"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "usable"
progress = 87
required_before = "beta-0.10.0"
next_action = "carry the production candidate's canonical Nuis token re-emission through the implemented clean-build aggregate, then add independent attester evidence"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_reproducibility -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuisc --lib repeated_same_thread_lowering_resets_try_expansion_names -j 1 -- --test-threads=1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_structural_projection_candidate two_uncached_clean_candidates_bind_one_reproducibility_aggregate -j 1 -- --test-threads=1"
expected_artifact = "a Nuis-decoded and canonically re-emitted token payload retaining the path-free two-clean-build aggregate without replacement authority"
blocker = "local repeated clean-build evidence covers scalar token decoding while canonical page re-emission remains outside production; independent attester trust and reversible authorization remain open"
