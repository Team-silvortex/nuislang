protocol = "nuis-self-hosting-readiness-v1"
release_line = "beta-0.6.*"
migration_start = "beta-0.10.*"
completion_window_start = "gamma-0.5.*"
completion_window_end = "gamma-0.10.*"
gate_count = 5

[[gates]]
id = "bootstrap-language-subset"
coordinate = "language-core/nuisc/bootstrap-language-subset"
status = "stable"
progress = 100
required_before = "beta-0.10.0"
next_action = "preserve v1 as the stage0/stage1 dependency ceiling and introduce a new protocol version before admitting another language capability"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuisc command_bootstrap -j 1"
expected_artifact = "nuis-bootstrap-language-subset-v1, nuisc bootstrap-check, and accepted plus rejected Nuis fixtures crossing the normal semantic pipeline"
blocker = "none for subset v1; compiler-owned text, vector, map, arena, span, diagnostic, and path behavior remains the next independent readiness gate"

[[gates]]
id = "compiler-data-model"
coordinate = "standard-library/std/compiler-data-model"
status = "usable"
progress = 75
required_before = "beta-0.10.0"
next_action = "replace the bounded four-slot proof containers with deterministic page- or chunk-backed growth while preserving the v1 ownership, UTF-8, error, and layout invariants"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-data-model-v1 plus a pure Nuis compiler component that passes bootstrap-check, builds without deferred LLVM lowering, and exits with deterministic score 43"
blocker = "the v1 proof closes host-layout leakage for one real component, but four-slot vector/map capacity and integer-only map keys cannot yet sustain a realistic tokenizer or parser workload"

[[gates]]
id = "stage-neutral-ir-boundary"
coordinate = "language-core/nuisc/stage-neutral-ir-boundary"
status = "early"
progress = 45
required_before = "beta-0.10.0"
next_action = "add standalone structural AST and NIR decoders, then require a future Nuis stage1 producer to emit the same semantic bundle identity"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_stage_handoff -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "nuis-compiler-stage-handoff-v1 with source, token, AST, NIR, and YIR SHA-256 records, canonical round trips, cache preservation, and producer-independent semantic identity"
blocker = "Rust stage0 emits and verifies all five records, but AST still regenerates from source, NIR lacks a standalone structural decoder, and no Nuis stage1 producer exists"

[[gates]]
id = "stage0-stage1-driver"
coordinate = "compiler-toolchain/bootstrap/stage0-stage1-driver"
status = "early"
progress = 60
required_before = "beta-0.10.0"
next_action = "emit the same component and component-bound diagnostic proof from a separately identified Nuis stage1 candidate"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_build -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_diagnostic_report -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "a separately attested Nuis stage1-candidate component record and normalized diagnostic proof ready for the implemented differential gate"
blocker = "the stage0 driver records compiler image, dependency closure, handoff, native output, diagnostic proof, stable reproducible identity, and exact audit identity, but no Nuis stage1 producer exists"

[[gates]]
id = "differential-reproducibility-gate"
coordinate = "developer-system/bootstrap/differential-reproducibility-gate"
status = "early"
progress = 60
required_before = "beta-0.10.0"
next_action = "run the implemented thirteen-check gate against a real Nuis-produced leaf stage1 candidate across repeated clean builds"
validation_command = "CARGO_INCREMENTAL=0 cargo test -q -p nuis-artifact compiler_component_diff -j 1 && CARGO_INCREMENTAL=0 cargo test -q -p nuis --test compiler_data_model_bootstrap -j 1"
expected_artifact = "a repository-native stage0/stage1 differential report that remains equivalent across clean rebuilds and still grants no replacement authority"
blocker = "the fail-closed comparison report and CLI exist, but no Nuis stage1 producer or independent reversible replacement authorization exists"
