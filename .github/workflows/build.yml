name: CPU Syntax Validation
on:
  push:
    branches: [work/cpu-nested-carry-validation-20260919]
permissions:
  contents: read
concurrency:
  group: cpu-syntax-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTUP_TOOLCHAIN: stable
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export exact source for offline editing
        run: |
          mkdir -p tmp/cpu-syntax
          git rev-parse HEAD > tmp/cpu-syntax/revision.txt
          git archive HEAD | gzip > tmp/cpu-syntax/source.tar.gz
          find . -name AGENTS.md -not -path './.git/*' -print > tmp/cpu-syntax/agent-instructions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-syntax-source
          path: tmp/cpu-syntax
          retention-days: 3
      - run: rustup toolchain install stable --profile minimal
      - run: cargo fetch --locked
      - name: Baseline existing CPU control-loop admission tests
        run: |
          set -o pipefail
          cargo test --locked -p nuisc --lib control_loops -- --test-threads=1 2>&1 | tee tmp/cpu-syntax/baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-syntax-baseline
          path: tmp/cpu-syntax/baseline.log
          retention-days: 3
